Slam:
  Mode: SLAM_WITHOUT_LOOP
Map:
  Covisibility:
    UseSimilarity: true
    ModuleFps: 100
Localization:
  Frame:
    MaxDepth: 10.0
  PointsQuery:
    TemporalBufferSize: 100
  PoseEstimation:
    InlierRatioThreshold: 0.2
  KeyframeCreation:
    GridCols: 4
    MinimumCellsCovered: 5
    KLDivergenceThreshold: 3.0
  Relocalization:
    QueryTopK: 10
Loop:
  QueryTopK: 20
