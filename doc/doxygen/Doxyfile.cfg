# @INCLUDE                = "./Doxyfile.cfg"
GENERATE_HTML           = NO
GENERATE_LATEX          = NO
GENERATE_XML            = YES
XML_PROGRAMLISTING      = NO

# Project Stuff
PROJECT_NAME           = "SLAM-MER"
PROJECT_BRIEF          = "Mitsubishi Electric Visual SLAM"
OUTPUT_DIRECTORY       = "./_docs"

# Inputs
INPUT                  = "./../../slam" \
                            "./../../localization" \
                            "./../../map" \
                            "./../../adjustment" \
                            "./../../interface" \
                            "./../../types" \
                            "./../../utils/include"
RECURSIVE              = YES
EXCLUDE                = "./../../utils/cudaSift"
EXCLUDE_PATTERNS       = */src/* \
                          */cudaSift/*
PREDEFINED             += DOXYGEN_SHOULD_SKIP_THIS
